{% extends 'mailings/base.html' %}
{% block content %}
<div class="container my-5">
    <div class="col-md-6 mx-auto">
        <h2>Новый пароль</h2>
        <form method="post" class="card p-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
