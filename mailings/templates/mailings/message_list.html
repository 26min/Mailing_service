{% extends 'mailings/base.html' %}
{% block title %}Сообщения{% endblock %}
{% block content %}
<h2>Сообщения</h2>
<a href="{% url 'mailings:message_create' %}" class="btn btn-primary mb-3">+ Добавить</a>
<table class="table table-striped">
    <thead><tr><th>Тема</th><th>Действия</th></tr></thead>
    <tbody>
    {% for message in messages %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>
                <a href="{% url 'mailings:message_update' message.pk %}" class="btn btn-sm btn-outline-secondary">✏️</a>
                <a href="{% url 'mailings:message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">🗑️</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="2">Пока нет сообщений</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
