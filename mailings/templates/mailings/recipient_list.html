{% extends 'mailings/base.html' %}
{% block title %}Получатели{% endblock %}
{% block content %}
<h2>Получатели</h2>
<a href="{% url 'mailings:recipient_create' %}" class="btn btn-primary mb-3">+ Добавить</a>
<table class="table table-striped">
    <thead><tr><th>Email</th><th>ФИО</th><th>Действия</th></tr></thead>
    <tbody>
    {% for recipient in recipients %}
        <tr>
            <td>{{ recipient.email }}</td>
            <td>{{ recipient.full_name }}</td>
            <td>
                <a href="{% url 'mailings:recipient_update' recipient.pk %}" class="btn btn-sm btn-outline-secondary">✏️</a>
                <a href="{% url 'mailings:recipient_delete' recipient.pk %}" class="btn btn-sm btn-outline-danger">🗑️</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3">Пока нет получателей</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
