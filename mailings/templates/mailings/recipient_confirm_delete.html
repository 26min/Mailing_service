{% extends 'mailings/base.html' %}
{% block content %}
<h2>Удалить получателя?</h2>
<p>{{ object.full_name }} ({{ object.email }})</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailings:recipient_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
