{% extends 'mailings/base.html' %}
{% block content %}
<h2>Удалить рассылку?</h2>
<p>Рассылка #{{ object.id }} ({{ object.message.subject }})</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailings:mailing_list' %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
